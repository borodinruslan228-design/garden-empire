<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>Garden Empire — ваш тихий уголок</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --panel: #111;
        --panel2: #151515;
        --line: #29251a;
        --gold: #d4af37;
        --gold2: #f0d77a;
        --text: #f3f0e8;
        --muted: #928f88;
        --green: #89a887;
        --red: #d27864;
        --serif: Georgia, "Times New Roman", serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #080808;
        color: var(--text);
        font:
          14px/1.5 Inter,
          "Segoe UI",
          Arial,
          sans-serif;
        min-height: 100vh;
      }
      button,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }
      ::selection {
        background: #d4af3740;
      }
      .app {
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 244px;
        padding: 29px 19px 20px;
        background: #0b0b0b;
        border-right: 1px solid #1b1914;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 8px 29px;
        border-bottom: 1px solid #201e19;
      }
      .brand-mark {
        width: 35px;
        height: 35px;
        border: 1px solid #806b29;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--gold);
        font-size: 18px;
        box-shadow: 0 0 22px #d4af371c;
      }
      .brand-name {
        font: 19px var(--serif);
        letter-spacing: 1.5px;
      }
      .brand-sub {
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 2.4px;
        margin-top: 1px;
      }
      .nav-label {
        margin: 25px 10px 10px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1.8px;
        color: #77736b;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav-btn {
        border: 1px solid transparent;
        background: none;
        border-radius: 8px;
        padding: 11px 12px;
        text-align: left;
        color: #aaa79f;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.2s;
      }
      .nav-btn:hover {
        background: #171612;
        color: #eee;
      }
      .nav-btn.active {
        background: linear-gradient(100deg, #d4af3716, transparent);
        border-color: #4c401c;
        color: var(--gold2);
      }
      .nav-ico {
        width: 18px;
        text-align: center;
        color: var(--gold);
        font-size: 15px;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .side-note {
        border-top: 1px solid #201e19;
        padding: 16px 8px 0;
        color: #77736b;
        font-size: 11px;
      }
      .side-note b {
        display: block;
        color: #c9c3b6;
        font: 14px var(--serif);
        margin-bottom: 4px;
      }
      .main {
        margin-left: 244px;
        min-height: 100vh;
      }
      .main:after {
        content: "";
        position: fixed;
        inset: 76px 0 0 244px;
        z-index: 2;
        pointer-events: none;
        opacity: 0.17;
        filter: blur(42px);
        background:
          radial-gradient(ellipse at 77% 24%, #d4af3740 0, transparent 35%),
          radial-gradient(ellipse at 28% 82%, #b58d3026 0, transparent 38%),
          radial-gradient(ellipse at 96% 75%, #d4af3724 0, transparent 31%);
        animation: golden-mist 28s ease-in-out infinite alternate;
      }
      .topbar {
        height: 76px;
        border-bottom: 1px solid #1b1914;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
        position: sticky;
        top: 0;
        background: #080808ed;
        backdrop-filter: blur(16px);
        z-index: 4;
      }
      .page-title {
        font: 22px var(--serif);
        letter-spacing: 0.3px;
      }
      .top-stats {
        display: flex;
        gap: 10px;
      }
      .stat-chip {
        background: #111;
        border: 1px solid #27241c;
        border-radius: 7px;
        padding: 7px 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
      }
      .stat-chip .label {
        color: var(--muted);
        font-size: 10px;
      }
      .stat-chip strong {
        font-weight: 600;
      }
      .gold {
        color: var(--gold2);
      }
      .level-chip {
        min-width: 145px;
      }
      .mini-progress {
        height: 3px;
        background: #29261e;
        border-radius: 5px;
        margin-top: 5px;
        overflow: hidden;
      }
      .mini-progress i {
        display: block;
        height: 100%;
        background: var(--gold);
        border-radius: 5px;
        transition: width 0.5s;
      }
      .content {
        max-width: 1420px;
        padding: 35px 42px 70px;
        margin: auto;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gold);
        margin-bottom: 9px;
      }
      .heading {
        font: 32px/1.15 var(--serif);
        font-weight: 400;
        margin: 0 0 9px;
      }
      .subheading {
        color: var(--muted);
        margin: 0;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 15px;
        margin: 35px 0 16px;
      }
      .section-head h2 {
        font: 23px var(--serif);
        font-weight: 400;
        margin: 0;
      }
      .section-head p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid #3d341c;
        border-radius: 12px;
        min-height: 196px;
        padding: 31px 34px;
        background:
          radial-gradient(ellipse at 82% 50%, #d4af3713, transparent 36%),
          linear-gradient(115deg, #14130f, #0e0e0d 70%);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .hero:after {
        content: "✳";
        position: absolute;
        font-size: 210px;
        right: 13%;
        top: -67px;
        color: #d4af3708;
        pointer-events: none;
      }
      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 530px;
      }
      .hero h1 {
        font: 36px/1.12 var(--serif);
        font-weight: 400;
        margin: 0 0 12px;
      }
      .hero p {
        margin: 0;
        color: #aaa69c;
        max-width: 460px;
      }
      .hero-meta {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 22px;
        text-align: center;
        padding-right: 4%;
      }
      .hero-meta strong {
        display: block;
        font: 26px var(--serif);
        color: var(--gold2);
      }
      .hero-meta span {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .plant-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 16px;
      }
      .plant-fertilizer {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        padding: 10px;
        border: 1px solid #39311d;
        border-radius: 9px;
        background:
          radial-gradient(ellipse at 100% 0%, #d4af3710, transparent 58%),
          linear-gradient(145deg, #14130f, #0e0e0d);
      }
      .fertilizer-picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: #c3b98f;
        font-size: 9px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .fertilizer-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .fertilizer-option {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 8px;
        text-align: left;
        border: 1px solid #302d25;
        border-radius: 7px;
        background: linear-gradient(145deg, #11110f, #0b0b0a);
        transition:
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.2s;
      }
      .fertilizer-option:hover {
        border-color: #766128;
        background: linear-gradient(145deg, #1a1812, #10100e);
      }
      .fertilizer-option[aria-pressed="true"] {
        border-color: #9c7e2b;
        background:
          radial-gradient(ellipse at 0 0, #d4af3718, transparent 75%),
          #15130e;
        box-shadow: inset 0 0 0 1px #d4af3710, 0 0 12px #d4af3710;
      }
      .fertilizer-option-icon {
        flex: 0 0 auto;
        color: var(--gold2);
        font-size: 15px;
        text-shadow: 0 0 10px #d4af3740;
      }
      .fertilizer-option-copy {
        min-width: 0;
        display: grid;
        gap: 1px;
      }
      .fertilizer-option-name {
        overflow: hidden;
        color: #dedbd3;
        font-size: 9px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fertilizer-option[aria-pressed="true"] .fertilizer-option-name {
        color: var(--gold2);
      }
      .fertilizer-option-detail {
        color: var(--muted);
        font-size: 8px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .fertilizer-apply {
        width: 100%;
        min-height: 34px;
        border-color: #665528;
        color: #e4d59f;
        background: #1b1912;
      }
      .fertilizer-apply:hover:not(:disabled) {
        border-color: var(--gold);
        background: #252012;
        color: #fff0b5;
      }
      .fertilizer-ready {
        color: var(--gold2);
        font-size: 10px;
        line-height: 1.45;
        padding: 2px;
      }
      .fertilizer-stock {
        color: var(--muted);
        font-size: 10px;
      }
      .shop-card.fertilizer-shop-card .shop-meta {
        display: grid;
        grid-template-columns: 1fr;
        align-items: stretch;
        gap: 8px;
      }
      .fertilizer-shop-card .shop-meta label {
        display: grid;
        gap: 4px;
      }
      .fertilizer-shop-card input[type="range"] {
        width: 100%;
        accent-color: var(--gold);
        cursor: pointer;
      }
      .fertilizer-quantity-value {
        color: var(--gold2);
        font-variant-numeric: tabular-nums;
      }
      .plant-card,
      .panel,
      .catalog-card,
      .task-card,
      .achievement-card,
      .shop-card {
        background: linear-gradient(145deg, #151515, #101010);
        border: 1px solid #29261f;
        border-radius: 10px;
      }
      .plant-card {
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.25s,
          transform 0.25s;
      }
      .plant-card:hover {
        border-color: #665528;
        transform: translateY(-2px);
      }
      .plant-card.maxed {
        border-color: #c5a238;
        background:
          radial-gradient(ellipse at 50% 5%, #d4af3710, transparent 52%),
          linear-gradient(145deg, #19170f, #10100e 65%);
        box-shadow:
          0 0 0 1px #d4af371b,
          0 0 30px #d4af3720,
          inset 0 0 24px #d4af3708;
      }
      .plant-card.maxed:hover {
        border-color: #efd276;
        box-shadow:
          0 0 0 1px #e4c35642,
          0 0 38px #d4af3733,
          inset 0 0 24px #d4af370d;
      }
      .plant-art {
        height: 180px;
        background:
          radial-gradient(ellipse at 50% 82%, #b8943420, transparent 47%),
          linear-gradient(180deg, #171714, #121211);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .plant-art.maxed {
        background:
          radial-gradient(ellipse at 50% 53%, #d4af372b, transparent 48%),
          radial-gradient(ellipse at 50% 100%, #d4af371b, transparent 48%),
          linear-gradient(180deg, #1b1912, #12110e);
      }
      .plant-art.maxed:before {
        content: "";
        position: absolute;
        left: 50%;
        top: 48%;
        width: 124px;
        height: 124px;
        border: 1px solid #e5ca704e;
        border-radius: 50%;
        box-shadow:
          0 0 13px #d4af3733,
          inset 0 0 14px #d4af3717;
        transform: translate(-50%, -50%);
        animation: maxed-halo 4s ease-in-out infinite;
      }
      .plant-art.maxed .plant-svg {
        position: relative;
        z-index: 1;
        filter:
          drop-shadow(0 0 7px #d4af3742)
          drop-shadow(0 8px 17px #000);
      }
      .plant-art:after {
        content: "";
        position: absolute;
        bottom: 24px;
        width: 140px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d4af3738, transparent);
      }
      .plant-svg {
        width: 145px;
        height: 158px;
        filter: drop-shadow(0 8px 17px #000);
        transition: transform 0.6s;
      }
      .plant-card:hover .plant-svg {
        transform: translateY(-4px) scale(1.03);
      }
      .rarity-tag {
        position: absolute;
        top: 13px;
        left: 14px;
        font-size: 9px;
        letter-spacing: 1.3px;
        text-transform: uppercase;
        color: var(--rarity, #a7ae90);
        border: 1px solid
          color-mix(in srgb, var(--rarity, #a7ae90) 40%, transparent);
        border-radius: 20px;
        padding: 4px 8px;
        background: #09090999;
      }
      .max-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        color: var(--gold2);
        font-size: 8px;
        letter-spacing: 1px;
        border: 1px solid #d4af3766;
        border-radius: 20px;
        padding: 4px 7px;
        background: #100f0bd9;
        box-shadow: 0 0 12px #d4af3720;
        z-index: 2;
      }
      .plant-card.maxed .plant-level {
        color: var(--gold2);
      }
      .plant-card.maxed .bar i {
        background: linear-gradient(90deg, #b38e2d, #f8e59a);
        box-shadow: 0 0 8px #d4af3766;
      }
      .plant-card.maxed .plant-description {
        color: #d7c78c;
      }
      .water-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #cfbd8240, transparent 65%);
        opacity: 0;
        pointer-events: none;
      }
      .watering .water-overlay {
        animation: water 1.4s ease-in-out infinite;
      }
      .plant-info {
        padding: 16px;
      }
      .plant-title-row {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 8px;
      }
      .plant-title {
        font: 19px var(--serif);
        margin: 0;
      }
      .plant-level {
        font-size: 10px;
        color: var(--gold2);
        white-space: nowrap;
        padding-top: 3px;
      }
      .plant-description {
        font-size: 11px;
        color: var(--muted);
        margin: 4px 0 15px;
        min-height: 16px;
      }
      .growth-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #a7a39a;
        margin-bottom: 6px;
      }
      .bar {
        height: 4px;
        border-radius: 4px;
        background: #292720;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #92752b, var(--gold2));
        border-radius: 4px;
        transition: width 0.5s;
      }
      .water-status {
        font-size: 10px;
        color: #aaa69c;
        margin: 13px 0 10px;
        min-height: 15px;
      }
      .water-status strong {
        color: #ded3ae;
        font-weight: 500;
      }
      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 9px;
      }
      .btn {
        border-radius: 6px;
        padding: 9px 13px;
        border: 1px solid #39352a;
        background: #191916;
        color: #dedbd3;
        font-size: 11px;
        transition: 0.2s;
      }
      .btn:hover:not(:disabled) {
        border-color: #9e812d;
        color: var(--gold2);
        background: #201d14;
      }
      .btn-primary {
        background: linear-gradient(120deg, #b39132, #d4af37);
        color: #100e08;
        border-color: #d4af37;
        font-weight: 650;
      }
      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(120deg, #d4af37, #f0d77a);
        color: #080808;
        box-shadow: 0 0 20px #d4af372d;
      }
      .btn-block {
        flex: 1;
      }
      .btn-small {
        padding: 7px 10px;
        font-size: 10px;
      }
      .panel {
        padding: 21px;
      }
      .quick-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 16px;
      }
      .daily-banner {
        background:
          radial-gradient(ellipse at 90% 30%, #d4af371a, transparent 40%),
          #13120f;
        border-color: #44391d;
      }
      .daily-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .daily-row h3 {
        font: 20px var(--serif);
        font-weight: 400;
        margin: 0 0 3px;
      }
      .daily-row p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
      }
      .streak {
        font: 21px var(--serif);
        color: var(--gold2);
        white-space: nowrap;
      }
      .toolbar {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .select {
        background: #111;
        border: 1px solid #302d25;
        border-radius: 6px;
        color: #ccc;
        padding: 8px 10px;
        font-size: 11px;
      }
      .catalog-grid,
      .shop-grid,
      .task-grid,
      .achievement-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 13px;
      }
      .catalog-card {
        overflow: hidden;
        position: relative;
      }
      .catalog-card.maxed {
        border-color: #c5a238;
        background:
          radial-gradient(ellipse at 50% 5%, #d4af3710, transparent 52%),
          linear-gradient(145deg, #19170f, #10100e 65%);
        box-shadow:
          0 0 0 1px #d4af371b,
          0 0 24px #d4af3720,
          inset 0 0 20px #d4af3708;
      }
      .catalog-card.maxed:hover {
        border-color: #efd276;
        box-shadow:
          0 0 0 1px #e4c35642,
          0 0 32px #d4af3733,
          inset 0 0 20px #d4af370d;
      }
      .catalog-card.locked {
        filter: saturate(0.35);
      }
      .catalog-art {
        height: 127px;
        display: grid;
        place-items: center;
        position: relative;
        background:
          radial-gradient(ellipse at center bottom, #d4af3716, transparent 65%),
          #131312;
      }
      .catalog-art.maxed {
        background:
          radial-gradient(ellipse at 50% 53%, #d4af372b, transparent 48%),
          radial-gradient(ellipse at 50% 100%, #d4af371b, transparent 48%),
          linear-gradient(180deg, #1b1912, #12110e);
      }
      .catalog-art.maxed:before {
        content: "";
        position: absolute;
        left: 50%;
        top: 48%;
        width: 98px;
        height: 98px;
        border: 1px solid #e5ca704e;
        border-radius: 50%;
        box-shadow:
          0 0 13px #d4af3733,
          inset 0 0 14px #d4af3717;
        transform: translate(-50%, -50%);
        animation: maxed-halo 4s ease-in-out infinite;
      }
      .catalog-art .plant-svg {
        width: 110px;
        height: 112px;
        position: relative;
        z-index: 1;
      }
      .catalog-art.maxed .plant-svg {
        filter:
          drop-shadow(0 0 7px #d4af3742)
          drop-shadow(0 8px 17px #000);
      }
      .locked .catalog-art .plant-svg {
        filter: brightness(0.25) grayscale(1);
      }
      .lock-mark {
        position: absolute;
        font-size: 19px;
        color: #ddd;
        background: #090909b0;
        border: 1px solid #454137;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
      }
      .catalog-info {
        padding: 13px;
      }
      .catalog-info h3 {
        font: 17px var(--serif);
        margin: 0 0 4px;
      }
      .catalog-info p {
        font-size: 10px;
        line-height: 1.5;
        color: var(--muted);
        margin: 0 0 10px;
        min-height: 30px;
      }
      .catalog-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--gold2);
      }
      .rarity-text {
        font-size: 9px;
        color: var(--rarity, #aaa);
        letter-spacing: 0.7px;
      }
      .collection-filters {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .task-card,
      .achievement-card,
      .shop-card {
        padding: 17px;
        position: relative;
      }
      .task-card.done,
      .achievement-card.unlocked {
        border-color: #766127;
        background: linear-gradient(140deg, #1c1910, #111);
      }
      .task-head {
        display: flex;

              icon: "◒",
              title: "Горшки",
              detail: "Сосуды для коллекции",
              count: POTS.filter((p) => !state.unlockedPots.includes(p.id))

              heading: "Горшки",

              cards: potCards,

            {
              id: "fertilizers",

              title: "Удобрения",
              detail: "Расходуемая подкормка",
              count: fertilizerStock,
              heading: "Удобрения для сада",
              copy: "Покупайте удобрения поштучно или запасом. Примените одно к растению перед поливом, чтобы сократить его время.",
              cards: fertilizerCards,
            },
          ];
          const selected = categories.find((c) => c.id === shopCategory) || categories[0];
          const resultCards =
            selected.cards ||
            `<div class="empty-state">${selected.empty || "Все доступные предметы уже открыты."}</div>`;
          return `<div class="eyebrow">Всё для вашего пространства</div><h1 class="heading">Магазин</h1><p class="subheading">Тратьте только игровую валюту — реальные покупки не нужны.</p><div class="shop-categories" role="tablist" aria-label="Разделы магазина">${categories.map((c) => `<button class="shop-category ${selected.id === c.id ? "active" : ""}" role="tab" aria-selected="${selected.id === c.id}" data-shop-category="${c.id}"><span class="shop-category-icon">${c.icon}</span><span class="shop-category-copy"><strong>${c.title}</strong><small>${c.detail}</small></span><span class="shop-category-count">${c.count}</span></button>`).join("")}</div><div class="shop-results-head"><div><h2>${selected.heading}</h2><p>${selected.copy}</p></div><span class="gold">${formatCoins(state.coins)} ✦</span></div><div class="shop-grid">${resultCards}</div>`;
        }
        function questsPage() {
          return `<div class="eyebrow">Маленькие цели, приятные награды</div><h1 class="heading">Задания</h1><p class="subheading">Задания обновляются по местному времени. Прогресс сохраняется между визитами.</p><div class="section-head"><div><h2>На сегодня</h2><p>${state.daily.date}</p></div><span class="gold">Серия: ${state.streak} ${state.streak === 1 ? "день" : "дн."}</span></div><div class="task-grid">${DAILY_TEMPLATES.map(
            (t) => {
              const val = Math.min(t.goal, dailyTaskProgress(t)),
                done = val >= t.goal,
                claimed = state.daily.claimed.includes(t.id);
              return `<article class="task-card ${claimed ? "done" : ""}" data-task-card="${t.id}"><div class="task-head"><h3>${t.name}</h3><span class="reward">+${t.reward} ✦</span></div><p>${t.desc}</p><div class="bar"><i style="width:${(val / t.goal) * 100}%"></i></div><div class="task-foot"><span>${val} / ${t.goal}</span><button class="btn ${done && !claimed ? "btn-primary" : ""} btn-small" data-action="claim-task" data-id="${t.id}" ${!done || claimed ? "disabled" : ""}>${claimed ? "Получено" : done ? "Забрать" : "В процессе"}</button></div></article>`;
            },
          ).join(
            "",
          )}</div><div class="section-head"><div><h2>Календарь посещений</h2><p>Пропуск не стирает историю и почти не влияет на серию.</p></div></div>${calendarMarkup()}`;
        }
        function calendarMarkup() {
          const now = new Date(),
            monthStart = new Date(now.getFullYear(), now.getMonth(), 1),
            days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(),
            offset = (monthStart.getDay() + 6) % 7,
            labels = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
          return `<div class="panel"><div class="daily-row"><h3 style="font:19px var(--serif);font-weight:400;margin:0">${now.toLocaleDateString("ru-RU", { month: "long", year: "numeric" })}</h3><span class="gold">✦ ${state.streak} подряд</span></div><div class="calendar">${labels.map((l) => `<div style="text-align:center;color:#777;font-size:9px">${l}</div>`).join("")}${Array.from({ length: offset }, () => "<div></div>").join("")}${Array.from(
            { length: days },
            (_, i) => {
              const d = i + 1,
                key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`,
                visited = state.stats.visitedDates.includes(key);
              return `<div class="day-cell ${visited ? "visited" : ""} ${d === now.getDate() ? "today" : ""}">${d}${visited ? "<i></i>" : ""}</div>`;
            },
          ).join("")}</div></div>`;
        }
        function achievementsPage() {
          const pendingRewards = state.achievements.filter(
            (id) => !state.claimedAchievements.includes(id),
          ).length;
          const claimedCoins = state.claimedAchievements.reduce(
            (total, id) =>
              total +
              (ACHIEVEMENTS.find((achievement) => achievement.id === id)
                ?.reward || 0),
            0,
          );
          return `<div class="eyebrow">Долгий путь отмечен красивыми моментами</div><h1 class="heading">Достижения</h1><p class="subheading">Награды за любопытство, терпение и заботу. Выполненные достижения ждут, пока вы заберёте награду.</p><div class="stat-overview"><div class="stat-box"><b data-achievement-total>${state.achievements.length}</b><span>Выполнено</span></div><div class="stat-box"><b data-achievement-pending>${pendingRewards}</b><span>Наград ждут</span></div><div class="stat-box"><b data-achievement-coins>${formatCoins(claimedCoins)}</b><span>Монет забрано</span></div><div class="stat-box"><b data-achievement-maxed>${state.stats.maxed}</b><span>Растений на максимуме</span></div></div><div class="achievement-grid">${ACHIEVEMENTS.map(
            (a) => {
              const val = Math.min(a.goal, achievementProgress(a)),
                done = state.achievements.includes(a.id),
                claimed = state.claimedAchievements.includes(a.id);
              const rewardStatus = claimed
                ? "Награда получена"
                : done
                  ? "Награда готова"
                  : `${val} / ${a.goal}`;
              return `<article class="achievement-card ${done ? "unlocked" : ""}" data-achievement-card="${a.id}"><div class="achievement-icon">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p><div class="bar"><i style="width:${(val / a.goal) * 100}%"></i></div><div class="achievement-progress">${rewardStatus} · ${a.reward} ✦</div>${done && !claimed ? `<button class="btn btn-primary btn-small" data-action="claim-achievement" data-id="${a.id}">Забрать награду</button>` : ""}</article>`;
            },
          ).join("")}</div>`;
        }
        function statsPage() {
          const maxedCount = state.stats.maxed;
          const maxLevel = Math.max(
            ...state.owned.map((id) => state.plants[id].level),
          );
          const fertilizerStock = Object.values(state.fertilizers).reduce(
            (total, amount) => total + amount,
            0,
          );
          return `<div class="eyebrow">Ваш путь в цифрах</div><h1 class="heading">Статистика сада</h1><p class="subheading">История заботы — спокойный рост день за днём.</p><div class="stat-overview"><div class="stat-box"><b>${ownedSpeciesCount()}</b><span>Растений в саду</span></div><div class="stat-box"><b>${state.stats.waters}</b><span>Завершённых поливов</span></div><div class="stat-box"><b>${maxedCount}</b><span>Максимальных уровней</span></div><div class="stat-box"><b>${state.stats.days}</b><span>Дней в саду</span></div><div class="stat-box"><b>${state.accountLevel}</b><span>Уровень садовода</span></div><div class="stat-box"><b>${maxLevel}</b><span>Лучший уровень растения</span></div><div class="stat-box"><b>${ownedSpeciesCount()} / ${SPECIES.length}</b><span>Открытых видов</span></div><div class="stat-box"><b>${fertilizerStock}</b><span>Удобрений в запасе</span></div><div class="stat-box"><b class="playtime-value">${formatPlayTime(currentPlayTime())}</b><span>Время в игре</span></div></div><div class="panel"><h2 style="font:21px var(--serif);font-weight:400;margin:0 0 16px">Ваши растения</h2>${state.owned
            .map((id) => {
              const s = speciesById(id),
                p = state.plants[id],
                level = p.level;
              return `<div class="settings-row"><span>${s.name}<small>${s.rarity} · уровень ${level}</small></span><span class="gold">${level === MAX_LEVEL ? "МАКСИМУМ" : `${p.xp} / ${xpNeeded(level)} XP`}</span></div>`;
            })
            .join("")}</div>`;
        }
        function settingsPage() {
          return `<div class="eyebrow">Ваше пространство, ваши правила</div><h1 class="heading">Настройки</h1><p class="subheading">Настройки хранятся на этом устройстве вместе с игровым прогрессом.</p><div class="panel" style="margin-top:20px"><label class="settings-row"><span>Уменьшить анимации<small>Подходит для слабых устройств и чувствительности к движению.</small></span><input class="switch" type="checkbox" data-setting="reducedMotion" ${state.settings.reducedMotion ? "checked" : ""}></label><label class="settings-row"><span>Компактный вид<small>Сделать карточки растений ниже.</small></span><input class="switch" type="checkbox" data-setting="compact" ${state.settings.compact ? "checked" : ""}></label><div class="settings-row"><span>Локальное сохранение<small>Игра хранится только в этом браузере. Синхронизация между устройствами не подключена.</small></span><span class="gold">АКТИВНО</span></div><div class="settings-actions"><button class="btn" data-action="export">Скачать резервную копию</button><label class="btn">Загрузить сохранение<input type="file" accept="application/json" data-import style="display:none"></label></div></div><div class="panel" style="margin-top:14px"><h2 style="font:20px var(--serif);font-weight:400;margin:0 0 6px">Начать заново</h2><p style="font-size:11px;color:var(--muted);margin:0 0 13px">Удалит сохранённый сад на этом устройстве. Экспортируйте копию, если хотите сохранить прогресс.</p><button class="btn" data-action="reset">Сбросить прогресс</button></div>`;
        }
        function pageContent() {
          switch (currentPage) {
            case "collection":
              return collectionPage();
            case "shop":
              return shopPage();
            case "quests":
              return questsPage();
            case "achievements":
              return achievementsPage();
            case "stats":
              return statsPage();
            case "settings":
              return settingsPage();
            default:
              return gardenPage();
          }
        }
        function render() {
          document.body.classList.toggle(
            "reduced-motion",
            state.settings.reducedMotion,
          );
          document.body.classList.toggle("compact", state.settings.compact);
          if (!document.querySelector(".main")) {
            app.innerHTML = appShell();
          } else {
            document.querySelector("#content").innerHTML = pageContent();
            document.querySelector(".page-title").textContent =
              navItems().find((item) => item[0] === currentPage)?.[2] ||
              "Мой сад";
            document
              .querySelectorAll(".nav [data-page], .mobile-nav [data-page]")
              .forEach((button) => {
                button.classList.toggle(
                  "active",
                  button.dataset.page === currentPage,
                );
              });
          }
          if (state.settings.compact)
            document
              .querySelectorAll("#content .plant-art")
              .forEach((el) => (el.style.height = "135px"));
          if (
            matchMedia("(max-width: 700px)").matches &&
            document.querySelector(".mobile-nav button.active")
          )
            document
              .querySelector(".mobile-nav button.active")
              .scrollIntoView({
                block: "nearest",
                inline: "center",
                behavior: state.settings.reducedMotion ? "auto" : "smooth",
              });
        }
        function updatePlantCard(id) {
          const card = [...document.querySelectorAll("[data-plant-card]")].find(
            (element) => element.dataset.plantCard === id,
          );
          if (!card) return;
          const template = document.createElement("template");
          template.innerHTML = plantCard(id);
          const updated = template.content.firstElementChild;
          card.className = updated.className;
          card.querySelector(".plant-art").className =
            updated.querySelector(".plant-art").className;
          card.querySelector(".plant-art").innerHTML =
            updated.querySelector(".plant-art").innerHTML;
          card.querySelector(".plant-info").innerHTML =
            updated.querySelector(".plant-info").innerHTML;
        }
        function updateTopbar() {
          const level = document.querySelector(".level-chip strong");
          const levelProgress = document.querySelector(".mini-progress i");
          const coins = document.querySelector(".top-stats .stat-chip:nth-child(2) strong");
          if (!level || !levelProgress || !coins) return;
          const xpPct = Math.min(
            100,
            (state.accountXp / accountXpNeeded(state.accountLevel)) * 100,
          );
          level.textContent = `Ур. ${state.accountLevel}`;
          levelProgress.style.width = `${xpPct}%`;
          coins.textContent = formatCoins(state.coins);
        }
        function replaceSectionsFromMarkup(markup, selectors) {
          const template = document.createElement("template");
          template.innerHTML = markup;
          for (const selector of selectors) {
            const current = document.querySelector(selector);
            const replacement = template.content.querySelector(selector);
            if (current && replacement) current.replaceWith(replacement.cloneNode(true));
          }
        }
        function refreshShopView() {
          if (currentPage !== "shop") return;
          updateTopbar();
          replaceSectionsFromMarkup(shopPage(), [
            ".shop-categories",
            ".shop-results-head",
            ".shop-grid",
          ]);
        }
        function refreshCollectionPlantUI(id) {
          const grid = document.querySelector(".catalog-grid");
          if (!grid) return;
          const existing = grid.querySelector(`[data-species-card="${id}"]`);
          const template = document.createElement("template");
          template.innerHTML = collectionPage();
          const updated = template.content.querySelector(
            `[data-species-card="${id}"]`,
          );
          if (existing && updated) existing.replaceWith(updated);
          else if (existing) existing.remove();
          const replacementGrid = template.content.querySelector(".catalog-grid");
          const visibleCards = replacementGrid?.querySelectorAll(
            "[data-species-card]",
          ).length;
          if (visibleCards === 0)
            grid.innerHTML = '<div class="empty-state">По этим фильтрам растений нет.</div>';
          document.querySelector(".collection-open-count").textContent =
            `${ownedSpeciesCount()} из ${SPECIES.length} открыто`;
        }
        function refreshShopStateUI() {
          if (currentPage !== "shop") return;
          updateTopbar();
          const resultCoins = document.querySelector(".shop-results-head .gold");
          if (resultCoins) resultCoins.textContent = `${formatCoins(state.coins)} ✦`;
          document
            .querySelectorAll("[data-fertilizer-card]")
            .forEach((card) => {
              const fertilizer = FERTILIZERS.find(
                (item) => item.id === card.dataset.fertilizerCard,
              );
              const button = card.querySelector(
                '[data-action="buy-fertilizer"]',
              );
              if (!fertilizer || !button) return;
              const unlocked = state.accountLevel >= fertilizer.level;
              card.classList.toggle("locked", !unlocked);
              button.disabled = !unlocked;
              button.classList.toggle("btn-primary", unlocked);
              button.textContent = unlocked
                ? "Купить выбранное количество"
                : `Откроется на ур. ${fertilizer.level}`;
            });
        }
        function refreshCollectionCards() {
          const grid = document.querySelector(".catalog-grid");
          if (!grid) return;
          const template = document.createElement("template");
          template.innerHTML = collectionPage();
          grid.querySelectorAll("[data-species-card]").forEach((card) => {
            const updated = template.content.querySelector(
              `[data-species-card="${card.dataset.speciesCard}"]`,
            );
            if (updated) card.replaceWith(updated);
          });
        }
        function refreshPotPurchaseUI(id) {
          updateTopbar();
          const potIds = [id, state.equippedPot];
          for (const potId of new Set(potIds)) {
            const card = document.querySelector(`[data-pot-card="${potId}"]`);
            const pot = POTS.find((item) => item.id === potId);
            if (!card || !pot) continue;
            const owned = state.unlockedPots.includes(pot.id);
            const equipped = state.equippedPot === pot.id;
            const label = card.querySelector(".coin-cost");
            const button = card.querySelector('[data-action="pot"]');
            if (label)
              label.textContent = equipped
                ? "ИСПОЛЬЗУЕТСЯ"
                : owned
                  ? "ОТКРЫТО"
                  : `${formatCoins(pot.cost)} ✦`;
            if (button) {
              button.disabled = equipped;
              button.classList.toggle("btn-primary", !equipped);
              button.textContent = equipped ? "Выбрано" : owned ? "Выбрать" : "Купить";
            }
          }
          const remaining = POTS.filter(
            (pot) => !state.unlockedPots.includes(pot.id),
          ).length;
          const count = document.querySelector(
            '[data-shop-category="pots"] .shop-category-count',
          );
          if (count) count.textContent = remaining;
          const resultCoins = document.querySelector(".shop-results-head .gold");
          if (resultCoins) resultCoins.textContent = `${formatCoins(state.coins)} ✦`;
          if (currentPage === "garden")
            state.owned.forEach(updatePlantCard);
        }
        function refreshGardenUI() {
          const values = {
            "[data-garden-plants]": ownedSpeciesCount(),
            "[data-garden-waters]": state.stats.waters,
            "[data-garden-streak]": state.streak,
            "[data-garden-account-level]": `Ур. ${state.accountLevel}`,
            "[data-garden-account-xp]": `${state.accountXp} XP`,
            "[data-garden-account-next]":
              `${accountXpNeeded(state.accountLevel)} XP до уровня ${state.accountLevel + 1}`,
          };
          for (const [selector, value] of Object.entries(values)) {
            const element = document.querySelector(selector);
            if (element) element.textContent = String(value);
          }
          const progress = document.querySelector(
            "[data-garden-account-progress]",
          );
          if (progress)
            progress.style.width = `${Math.min(
              100,
              (state.accountXp / accountXpNeeded(state.accountLevel)) * 100,
            )}%`;
        }
        function refreshTaskCards() {
          const grid = document.querySelector(".task-grid");
          if (!grid) return;
          const template = document.createElement("template");
          template.innerHTML = questsPage();
          grid.querySelectorAll("[data-task-card]").forEach((card) => {
            const updated = template.content.querySelector(
              `[data-task-card="${card.dataset.taskCard}"]`,
            );
            if (
              updated &&
              (updated.className !== card.className ||
                updated.innerHTML !== card.innerHTML)
            )
              card.replaceWith(updated);
          });
        }
        function refreshAchievementPage() {
          const template = document.createElement("template");
          template.innerHTML = achievementsPage();
          const grid = document.querySelector(".achievement-grid");
          if (grid) {
            grid.querySelectorAll("[data-achievement-card]").forEach((card) => {
              const updated = template.content.querySelector(
                `[data-achievement-card="${card.dataset.achievementCard}"]`,
              );
              if (
                updated &&
                (updated.className !== card.className ||
                  updated.innerHTML !== card.innerHTML)
              )
                card.replaceWith(updated);
            });
          }
          for (const selector of [
            "[data-achievement-total]",
            "[data-achievement-pending]",
            "[data-achievement-coins]",
            "[data-achievement-maxed]",
          ]) {
            const current = document.querySelector(selector);
            const updated = template.content.querySelector(selector);
            if (current && updated) current.textContent = updated.textContent;
          }
        }
        function refreshCurrentPage() {
          updateTopbar();
          switch (currentPage) {
            case "garden":
              refreshGardenUI();
              break;
            case "collection":
              refreshCollectionCards();
              break;
            case "shop":
              refreshShopStateUI();
              break;
            case "quests":
              refreshTaskCards();
              break;
            case "achievements":
              refreshAchievementPage();
              break;
          }
        }
        function navigate(page) {
          if (!navItems().some((n) => n[0] === page)) return;
          currentPage = page;
          render();
        }
        function handleAction(action, id, value) {
          switch (action) {
            case "water":
              startWatering(id);
              break;
            case "unlock":
              unlockPlant(id);
              break;
            case "daily":
              unlockDailyReward();
              break;
            case "claim-task":
              claimTask(id);
              break;
            case "claim-achievement":
              claimAchievement(id);
              break;
            case "pot":
              buyPot(id);
              break;
            case "buy-fertilizer":
              buyFertilizer(id, value);
              break;
            case "fertilize":
              applyFertilizer(id, value);
              break;
            case "export": {
              flushPlayTime();
              const blob = new Blob([JSON.stringify(state, null, 2)], {
                  type: "application/json",
                }),
                url = URL.createObjectURL(blob),
                a = document.createElement("a");
              a.href = url;
              a.download = "garden-empire-save.json";
              a.click();
              URL.revokeObjectURL(url);
              toast("Резервная копия готова");
              break;
            }
            case "reset":
              if (
                confirm(
                  "Удалить весь прогресс Garden Empire на этом устройстве? Это действие нельзя отменить.",
                )
              ) {
                localStorage.removeItem(SAVE_KEY);
                state = freshState();
                ensureDaily();
                playSessionStartedAt =
                  document.visibilityState === "visible" ? Date.now() : null;
                save();
                currentPage = "garden";
                render();
                toast("Создан новый сад");
              }
              break;
          }
        }
        app.addEventListener("click", (event) => {
          const category = event.target.closest("[data-shop-category]");
          if (category) {
            shopCategory = category.dataset.shopCategory;
            refreshShopView();
            return;
          }
          const fertilizerOption = event.target.closest(
            "[data-fertilizer-option]",
          );
          if (fertilizerOption) {
            const options = fertilizerOption
              .closest(".fertilizer-options")
              .querySelectorAll("[data-fertilizer-option]");
            options.forEach((option) =>
              option.setAttribute(
                "aria-pressed",
                String(option === fertilizerOption),
              ),
            );
            return;
          }
          const target = event.target.closest("[data-page],[data-action]");
          if (!target) return;
          if (target.dataset.page) {
            navigate(target.dataset.page);
            return;
          }
          let value;
          if (target.dataset.action === "fertilize") {
            value = target
              .closest("[data-plant-card]")
              ?.querySelector(
                '[data-fertilizer-option][aria-pressed="true"]',
              )?.dataset.fertilizerOption;
          } else if (target.dataset.action === "buy-fertilizer") {
            value = target.closest(".shop-card")?.querySelector(
              "[data-fertilizer-quantity]",
            )?.value;
          }
          handleAction(target.dataset.action, target.dataset.id, value);
        });
        app.addEventListener("change", (event) => {
          const t = event.target;
          if (t.matches("#rarity-filter")) {
            filterRarity = t.value;
            replaceSectionsFromMarkup(collectionPage(), [
              ".collection-filters",
              ".catalog-grid",
            ]);
          } else if (t.matches("#status-filter")) {
            filterStatus = t.value;
            replaceSectionsFromMarkup(collectionPage(), [
              ".collection-filters",
              ".catalog-grid",
            ]);
          } else if (t.matches("#level-filter")) {
            filterLevel = t.value;
            replaceSectionsFromMarkup(collectionPage(), [
              ".collection-filters",
              ".catalog-grid",
            ]);
          } else if (t.matches("[data-setting]")) {
            state.settings[t.dataset.setting] = t.checked;
            save();
            document.body.classList.toggle(
              "reduced-motion",
              state.settings.reducedMotion,
            );
            document.body.classList.toggle("compact", state.settings.compact);
          } else if (t.matches("[data-import]")) {
            const file = t.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const parsed = JSON.parse(String(reader.result));
                if (
                  !parsed ||
                  parsed.version !== 1 ||
                  !parsed.plants ||
                  !Array.isArray(parsed.owned)
                )
                  throw new Error(
                    "Файл не является сохранением Garden Empire.",
                  );
                state = normalizeState(parsed);
                playSessionStartedAt =
                  document.visibilityState === "visible" ? Date.now() : null;
                ensureDaily();
                save();
                render();
                toast("Сохранение загружено");
              } catch (error) {
                console.error("Не удалось импортировать сохранение:", error);
                toast("Не удалось загрузить файл", error.message);
              }
            };
            reader.onerror = () =>
              toast(
                "Не удалось прочитать файл",
                "Попробуйте выбрать файл ещё раз.",
              );
            reader.readAsText(file);
          }
        });
        app.addEventListener("input", (event) => {
          const target = event.target;
          if (target.matches("[data-fertilizer-quantity]")) {
            updateFertilizerQuantity(target);
          }
        });
        state = loadState();
        ensureDaily();
        settleWatering();
        checkAchievements();
        save();
        render();
        if (document.visibilityState === "visible")
          playSessionStartedAt = Date.now();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            flushPlayTime();
            playSessionStartedAt = null;
          } else if (playSessionStartedAt === null)
            playSessionStartedAt = Date.now();
        });
        window.addEventListener("pagehide", () => {
          flushPlayTime();
          playSessionStartedAt = null;
          save();
        });
        window.addEventListener("beforeunload", () => {
          flushPlayTime();
          playSessionStartedAt = null;
          save();
        });
        let lastPeriodicSave = Date.now();
        setInterval(() => {
          const now = Date.now(),
            changed = settleWatering();
          if (changed) {
            lastPeriodicSave = now;
          }
          document.querySelectorAll(".countdown").forEach((el) => {
            const remaining = Math.max(
              0,
              Math.ceil((Number(el.dataset.end) - now) / 1000),
            );
            el.textContent = fmtTime(remaining);
          });
          if (
            playSessionStartedAt !== null &&
            now - lastPeriodicSave >= 15000
          ) {
            flushPlayTime();
            lastPeriodicSave = now;
          }
          document
            .querySelectorAll(".playtime-value")
            .forEach(
              (el) => (el.textContent = formatPlayTime(currentPlayTime())),
            );
        }, 1000);
      })();
    </script>
  </body>
</html>
